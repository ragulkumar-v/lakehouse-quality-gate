[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not integration\""
markers = [
    "airflow: requires apache-airflow to be importable (skipped automatically otherwise)",
    "integration: opt-in test that needs a real external service (e.g. MinIO); skipped by default",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
    ".venv-data",
    ".venv-airflow",
    ".airflow_home",
    "dbt_project/target",
    "dbt_project/logs",
    "dbt_project/dbt_packages",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "quality", "chaos", "dags", "scripts"]
